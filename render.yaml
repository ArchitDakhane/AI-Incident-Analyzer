services:
  - type: web
    name: ai-incident-analyzer-api
    runtime: docker
    plan: 0.5c-512mb
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    preDeployCommand: alembic -c alembic/alembic.ini upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_HOST
        sync: false
      - key: QDRANT_PORT
        value: "6333"
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: incidents
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
      - key: MAX_ANALYSIS_LOG_CHARS
        value: "30000"
      - key: UPLOAD_DIRECTORY
        value: /var/data/uploads/logs
    disk:
      name: ai-incident-analyzer-uploads
      mountPath: /var/data
      sizeGB: 1
