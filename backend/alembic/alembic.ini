# Generic single-database configuration.

[alembic]
# Paths are anchored to this configuration file, not the current directory.
sqlalchemy.url = postgresql://unused:unused@localhost/unused
script_location = %(here)s
prepend_sys_path = %(here)s/..
sqlalchemy_compare_server_default = false
version_location_suffix =
version_path_identifier = 
script_location_package =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
